name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install patchelf
        run: sudo apt-get install -y patchelf

      - name: Bundle Termux Node.js
        run: |
          set -e
          MIRROR="https://packages-cf.termux.dev/apt/termux-main"
          PKGS="nodejs libc++ openssl zlib c-ares libicu libsqlite"
          
          mkdir -p work && cd work
          
          # Get package index
          curl -sL "$MIRROR/dists/stable/main/binary-aarch64/Packages.gz" | gunzip > Packages
          
          # Download and extract all packages
          mkdir -p extracted
          for pkg in $PKGS; do
            # Use grep+awk instead of awk regex (avoids issues with + in package names like libc++)
            url=$(grep -A 20 "^Package: ${pkg}$" Packages | grep "^Filename:" | head -1 | awk '{print $2}')
            [ -z "$url" ] && echo "WARN: $pkg not found" && continue
            echo "📦 $pkg"
            wget -q "$MIRROR/$url" -O "${pkg}.deb"
            mkdir -p _deb
            ar x "${pkg}.deb" --output=_deb 2>/dev/null || true
            for f in _deb/data.tar.*; do [ -f "$f" ] && tar xf "$f" -C extracted/ 2>/dev/null || true; done
            rm -rf _deb
          done
          
          # Locate everything
          NODE=$(find extracted -name "node" -path "*/bin/node" -type f | head -1)
          LIBDIR=$(find extracted -path "*/usr/lib" -type d | head -1)
          
          echo "Node: $NODE"
          echo "Libs: $LIBDIR"
          echo ""
          echo "=== Node NEEDED (original) ==="
          readelf -d "$NODE" | grep NEEDED
          
          echo ""
          echo "=== Available .so files ==="
          ls -la "$LIBDIR"/*.so* 2>/dev/null || true
          
          # Strategy: patchelf node to replace ALL versioned deps with unversioned names
          # Then bundle both names in jniLibs
          JNIDIR="../app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNIDIR"
          
          # Step 1: Copy node binary
          cp "$NODE" "$JNIDIR/libnode.so"
          chmod 755 "$JNIDIR/libnode.so"
          
          # Step 2: patchelf - replace versioned NEEDED with unversioned
          echo ""
          echo "=== Patching node binary ==="
          
          # libz.so.1 → libz.so  
          patchelf --replace-needed "libz.so.1" "libz.so" "$JNIDIR/libnode.so" && echo "  libz.so.1 → libz.so" || true
          # libcrypto.so.3 → libcrypto.so
          patchelf --replace-needed "libcrypto.so.3" "libcrypto.so" "$JNIDIR/libnode.so" && echo "  libcrypto.so.3 → libcrypto.so" || true
          # libssl.so.3 → libssl.so
          patchelf --replace-needed "libssl.so.3" "libssl.so" "$JNIDIR/libnode.so" && echo "  libssl.so.3 → libssl.so" || true
          # libicui18n.so.78 → libicui18n.so
          patchelf --replace-needed "libicui18n.so.78" "libicui18n.so" "$JNIDIR/libnode.so" && echo "  libicui18n.so.78 → libicui18n.so" || true
          # libicuuc.so.78 → libicuuc.so
          patchelf --replace-needed "libicuuc.so.78" "libicuuc.so" "$JNIDIR/libnode.so" && echo "  libicuuc.so.78 → libicuuc.so" || true
          
          # Remove rpath (points to Termux paths)
          patchelf --remove-rpath "$JNIDIR/libnode.so" 2>/dev/null || true
          
          echo ""
          echo "=== Node NEEDED (after patch) ==="
          readelf -d "$JNIDIR/libnode.so" | grep NEEDED
          
          # Step 3: Copy ALL needed .so files (unversioned names)
          echo ""
          echo "=== Copying libraries ==="
          
          NEEDED_LIBS="libz.so libcares.so libsqlite3.so libcrypto.so libssl.so libicui18n.so libicuuc.so libc++_shared.so libicudata.so"
          
          for lib in $NEEDED_LIBS; do
            # Try exact match in the primary lib dir
            src="$LIBDIR/$lib"
            if [ ! -f "$src" ]; then
              # Search EVERYWHERE in extracted (covers different Termux package layouts)
              src=$(find extracted -name "$lib" -type f 2>/dev/null | head -1)
            fi
            if [ ! -f "$src" ] && [ -n "$LIBDIR" ]; then
              # Try symlink targets — some are symlinks to versioned files
              for candidate in "$LIBDIR/${lib}"*; do
                [ -f "$candidate" ] && src="$candidate" && break
              done
            fi
            if [ -f "$src" ]; then
              cp "$src" "$JNIDIR/$lib"
              echo "  ✅ $lib ($(ls -lh "$JNIDIR/$lib" | awk '{print $5}'))"
            else
              echo "  ❌ $lib NOT FOUND — searching deeper..."
              # Last resort: search by partial name
              partial=$(echo "$lib" | sed 's/\.so$//')
              deep=$(find extracted -name "${partial}*" -type f 2>/dev/null | head -1)
              if [ -n "$deep" ]; then
                cp "$deep" "$JNIDIR/$lib"
                echo "    → found at $deep ✅"
              else
                echo "    → truly missing ❌"
              fi
            fi
          done
          
          # Step 4: Verify — check what libnode.so needs vs what we have
          echo ""
          echo "=== Verification ==="
          ALL_OK=true
          for needed in $(readelf -d "$JNIDIR/libnode.so" | grep NEEDED | sed 's/.*\[//;s/\]//'); do
            case "$needed" in
              libc.so|libm.so|libdl.so|liblog.so|libandroid.so)
                echo "  ✅ $needed (system)"
                ;;
              *)
                if [ -f "$JNIDIR/$needed" ]; then
                  echo "  ✅ $needed"
                else
                  echo "  ❌ $needed MISSING!"
                  ALL_OK=false
                fi
                ;;
            esac
          done
          
          # Also check transitive deps of our bundled libs
          echo ""
          echo "=== Transitive dependency check ==="
          for so in "$JNIDIR"/lib*.so; do
            [ "$(basename "$so")" = "libnode.so" ] && continue
            for needed in $(readelf -d "$so" 2>/dev/null | grep NEEDED | sed 's/.*\[//;s/\]//' || true); do
              case "$needed" in
                libc.so|libm.so|libdl.so|liblog.so|libandroid.so) ;;
                *)
                  if [ ! -f "$JNIDIR/$needed" ]; then
                    echo "  ⚠️  $(basename "$so") needs $needed — MISSING, patching..."
                    # Try to find and copy it
                    tsrc=$(find extracted -name "$needed" -type f 2>/dev/null | head -1)
                    if [ -n "$tsrc" ]; then
                      cp "$tsrc" "$JNIDIR/$needed"
                      echo "    → copied"
                    else
                      # Try unversioned
                      base=$(echo "$needed" | sed 's/\.so\..*/\.so/')
                      patchelf --replace-needed "$needed" "$base" "$so" 2>/dev/null && echo "    → patched to $base" || true
                    fi
                  fi
                  ;;
              esac
            done
          done
          
          echo ""
          echo "=== Final jniLibs ==="
          ls -lh "$JNIDIR"/
          
          if [ "$ALL_OK" = false ]; then
            echo "⚠️  Some libraries missing but continuing..."
          fi

      - name: Bundle npm as assets
        run: |
          NPM_DIR=$(find work/extracted -path "*/lib/node_modules/npm" -type d | head -1)
          if [ -n "$NPM_DIR" ]; then
            mkdir -p app/src/main/assets/npm
            cp -r "$NPM_DIR"/* app/src/main/assets/npm/
            echo "✅ npm: $(du -sh app/src/main/assets/npm/ | awk '{print $1}')"
          fi

      - name: Install Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Setup debug keystore
        run: |
          mkdir -p $HOME/.android
          keytool -genkeypair -v \
            -keystore $HOME/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Re-sign APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find $ANDROID_HOME -name "apksigner" -type f 2>/dev/null | sort -r | head -1)
          ZIPALIGN=$(find $ANDROID_HOME -name "zipalign" -type f 2>/dev/null | sort -r | head -1)
          zip -d "$APK" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 2>/dev/null || true
          ALIGNED=/tmp/app-aligned.apk
          "$ZIPALIGN" -f -p 4 "$APK" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks $HOME/.android/debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$APK" "$ALIGNED"
          "$APKSIGNER" verify --verbose "$APK"
          echo "APK size: $(ls -lh "$APK" | awk '{print $5}')"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClawLauncher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
