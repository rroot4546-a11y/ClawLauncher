name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Bundle Termux Node.js for Android
        run: |
          set -e
          TERMUX_MIRROR="https://packages-cf.termux.dev/apt/termux-main"
          
          mkdir -p termux-work && cd termux-work
          
          # Download Termux package index
          echo "📦 Fetching Termux package index..."
          curl -sL "$TERMUX_MIRROR/dists/stable/main/binary-aarch64/Packages.gz" | gunzip > Packages
          
          # Function to get package URL
          get_pkg_url() {
            awk "/^Package: $1\$/,/^\$/" Packages | grep "^Filename:" | head -1 | awk '{print $2}'
          }
          
          # Download node and its required dependencies
          PACKAGES="nodejs libc++ openssl zlib"
          for pkg in $PACKAGES; do
            url=$(get_pkg_url "$pkg")
            if [ -n "$url" ]; then
              echo "⬇️  Downloading $pkg..."
              wget -q "$TERMUX_MIRROR/$url" -O "$pkg.deb" || echo "  ⚠️  Failed to download $pkg"
            else
              echo "  ⚠️  Package $pkg not found"
            fi
          done
          
          # Extract all debs
          mkdir -p extracted
          for deb in *.deb; do
            [ ! -f "$deb" ] && continue
            echo "📂 Extracting $deb..."
            mkdir -p tmp_deb
            ar x "$deb" --output=tmp_deb 2>/dev/null || true
            for archive in tmp_deb/data.tar.*; do
              [ -f "$archive" ] && tar xf "$archive" -C extracted/ 2>/dev/null || true
            done
            rm -rf tmp_deb
          done
          
          echo "📋 Extracted files:"
          find extracted -type f | head -50
          
          # Prepare assets directory
          ASSETS="../app/src/main/assets/node-android"
          mkdir -p "$ASSETS/bin" "$ASSETS/lib"
          
          # Find and copy node binary
          NODE_BIN=$(find extracted -name "node" -type f | grep bin/node | head -1)
          if [ -n "$NODE_BIN" ]; then
            cp "$NODE_BIN" "$ASSETS/bin/node"
            chmod 755 "$ASSETS/bin/node"
            echo "✅ Node binary: $(file "$NODE_BIN")"
            echo "   Size: $(ls -lh "$ASSETS/bin/node" | awk '{print $5}')"
          else
            echo "❌ Node binary not found!"
            find extracted -name "node" -type f
            exit 1
          fi
          
          # Copy shared libraries
          USR_LIB=$(find extracted -path "*/usr/lib" -type d | head -1)
          if [ -n "$USR_LIB" ]; then
            # Copy all .so files that node depends on
            for lib in libc++_shared.so libcrypto.so libssl.so libz.so; do
              src=$(find "$USR_LIB" -name "${lib}*" -type f 2>/dev/null | head -1)
              [ -n "$src" ] && cp "$src" "$ASSETS/lib/" && echo "  📚 $lib"
            done
            
            # Also copy versioned symlink targets
            for lib in $(find "$USR_LIB" -name "*.so.*" -type f 2>/dev/null); do
              base=$(basename "$lib")
              cp "$lib" "$ASSETS/lib/$base" 2>/dev/null && echo "  📚 $base"
            done
          fi
          
          # Also bundle npm from the nodejs package
          NPM_DIR=$(find extracted -path "*/lib/node_modules/npm" -type d | head -1)
          if [ -n "$NPM_DIR" ]; then
            mkdir -p "$ASSETS/lib/node_modules"
            cp -r "$NPM_DIR" "$ASSETS/lib/node_modules/npm"
            echo "✅ npm bundled"
          fi
          
          echo ""
          echo "📊 Final assets:"
          du -sh "$ASSETS"
          du -sh "$ASSETS/bin" "$ASSETS/lib" 2>/dev/null
          find "$ASSETS" -maxdepth 3 -type f | head -20

      - name: Install Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Setup debug keystore
        run: |
          mkdir -p $HOME/.android
          keytool -genkeypair -v \
            -keystore $HOME/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Re-sign APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find $ANDROID_HOME -name "apksigner" -type f 2>/dev/null | sort -r | head -1)
          ZIPALIGN=$(find $ANDROID_HOME -name "zipalign" -type f 2>/dev/null | sort -r | head -1)
          zip -d "$APK" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 2>/dev/null || true
          ALIGNED=/tmp/app-aligned.apk
          "$ZIPALIGN" -f -p 4 "$APK" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks $HOME/.android/debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$APK" "$ALIGNED"
          "$APKSIGNER" verify --verbose "$APK"
          echo "APK size: $(ls -lh "$APK" | awk '{print $5}')"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClawLauncher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
