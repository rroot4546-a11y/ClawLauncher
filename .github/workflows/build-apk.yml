name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install patchelf
        run: sudo apt-get install -y patchelf

      - name: Bundle Termux Node.js as native library
        run: |
          set -e
          TERMUX_MIRROR="https://packages-cf.termux.dev/apt/termux-main"
          
          mkdir -p termux-work && cd termux-work
          
          # Download Termux package indices
          echo "📦 Fetching package indices..."
          curl -sL "$TERMUX_MIRROR/dists/stable/main/binary-aarch64/Packages.gz" | gunzip > Packages-arm64
          curl -sL "$TERMUX_MIRROR/dists/stable/main/binary-x86_64/Packages.gz" | gunzip > Packages-x64
          
          get_pkg_url() {
            awk "/^Package: $2\$/,/^\$/" "Packages-$1" | grep "^Filename:" | head -1 | awk '{print $2}'
          }
          
          extract_deb() {
            local deb="$1" dest="$2"
            mkdir -p tmp_deb
            ar x "$deb" --output=tmp_deb 2>/dev/null || true
            for archive in tmp_deb/data.tar.*; do
              [ -f "$archive" ] && tar xf "$archive" -C "$dest" 2>/dev/null || true
            done
            rm -rf tmp_deb
          }
          
          process_arch() {
            local ARCH="$1" JNI_ARCH="$2"
            echo ""
            echo "========== Processing $ARCH → $JNI_ARCH =========="
            
            mkdir -p "${ARCH}-extract"
            for pkg in nodejs libc++ openssl zlib c-ares libicu libsqlite; do
              url=$(get_pkg_url "$ARCH" "$pkg")
              if [ -n "$url" ]; then
                echo "  ⬇️  $pkg"
                wget -q "$TERMUX_MIRROR/$url" -O "${pkg}-${ARCH}.deb"
                extract_deb "${pkg}-${ARCH}.deb" "${ARCH}-extract"
              fi
            done
            
            local JNI_DIR="../app/src/main/jniLibs/$JNI_ARCH"
            mkdir -p "$JNI_DIR"
            
            # Find node binary
            local NODE_BIN=$(find "${ARCH}-extract" -name "node" -path "*/bin/node" -type f | head -1)
            if [ -z "$NODE_BIN" ]; then
              echo "  ❌ Node binary not found for $ARCH!"
              return 1
            fi
            
            echo "  📋 Node needs (before patching):"
            readelf -d "$NODE_BIN" | grep NEEDED | head -20
            
            # Copy ALL .so files from extracted Termux packages
            # This catches direct deps AND transitive deps (like libc++_shared.so)
            local USR_LIB=$(find "${ARCH}-extract" -path "*/usr/lib" -type d | head -1)
            
            declare -A RENAME_MAP
            
            if [ -n "$USR_LIB" ]; then
              echo "  📚 Copying ALL shared libraries from Termux..."
              
              # Find every .so file (including versioned ones like libz.so.1)
              find "$USR_LIB" -maxdepth 1 \( -name "*.so" -o -name "*.so.*" \) -type f | while read src; do
                local orig_name=$(basename "$src")
                local android_name
                
                if echo "$orig_name" | grep -q '\.so\.'; then
                  # Versioned: libz.so.1 → libz_v1.so
                  android_name=$(echo "$orig_name" | sed 's/\.so\.\(.*\)/_v\1.so/')
                else
                  android_name="$orig_name"
                fi
                
                # Ensure lib prefix
                case "$android_name" in lib*) ;; *) android_name="lib${android_name}" ;; esac
                
                cp "$src" "$JNI_DIR/$android_name"
                echo "    $orig_name → $android_name"
                
                # Track renames for patchelf
                if [ "$orig_name" != "$android_name" ]; then
                  echo "$orig_name=$android_name" >> /tmp/rename_map_${JNI_ARCH}.txt
                fi
              done
            fi
            
            # Copy node binary
            cp "$NODE_BIN" "$JNI_DIR/libnode.so"
            chmod 755 "$JNI_DIR/libnode.so"
            
            # Patch node binary: rename all versioned NEEDED entries
            if [ -f "/tmp/rename_map_${JNI_ARCH}.txt" ]; then
              while IFS='=' read -r old_name new_name; do
                echo "  🔧 patchelf: $old_name → $new_name"
                patchelf --replace-needed "$old_name" "$new_name" "$JNI_DIR/libnode.so" 2>/dev/null || true
              done < "/tmp/rename_map_${JNI_ARCH}.txt"
            fi
            
            # Also patch all .so libs that might reference versioned names
            if [ -f "/tmp/rename_map_${JNI_ARCH}.txt" ]; then
              for so_file in "$JNI_DIR"/lib*.so; do
                [ "$so_file" = "$JNI_DIR/libnode.so" ] && continue
                while IFS='=' read -r old_name new_name; do
                  patchelf --replace-needed "$old_name" "$new_name" "$so_file" 2>/dev/null || true
                done < "/tmp/rename_map_${JNI_ARCH}.txt"
              done
            fi
            
            patchelf --remove-rpath "$JNI_DIR/libnode.so" 2>/dev/null || true
            
            echo "  📋 Node NEEDED (after patching):"
            readelf -d "$JNI_DIR/libnode.so" | grep NEEDED | head -20
            
            echo "  ✅ $JNI_ARCH done!"
          }
          
          process_arch "arm64" "arm64-v8a"
          process_arch "x64" "x86_64" || echo "⚠️  x86_64 optional, continuing..."
          
          # Bundle npm as assets
          NPM_DIR=$(find arm64-extract -path "*/lib/node_modules/npm" -type d | head -1)
          if [ -n "$NPM_DIR" ]; then
            mkdir -p ../app/src/main/assets/npm
            cp -r "$NPM_DIR"/* ../app/src/main/assets/npm/
            echo ""
            echo "✅ npm bundled: $(du -sh ../app/src/main/assets/npm/ | awk '{print $1}')"
          fi
          
          echo ""
          echo "📊 Final jniLibs:"
          find ../app/src/main/jniLibs -type f -exec ls -lh {} \;

      - name: Install Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Setup debug keystore
        run: |
          mkdir -p $HOME/.android
          keytool -genkeypair -v \
            -keystore $HOME/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Re-sign APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find $ANDROID_HOME -name "apksigner" -type f 2>/dev/null | sort -r | head -1)
          ZIPALIGN=$(find $ANDROID_HOME -name "zipalign" -type f 2>/dev/null | sort -r | head -1)
          zip -d "$APK" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 2>/dev/null || true
          ALIGNED=/tmp/app-aligned.apk
          "$ZIPALIGN" -f -p 4 "$APK" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks $HOME/.android/debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$APK" "$ALIGNED"
          "$APKSIGNER" verify --verbose "$APK"
          echo "APK size: $(ls -lh "$APK" | awk '{print $5}')"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClawLauncher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
