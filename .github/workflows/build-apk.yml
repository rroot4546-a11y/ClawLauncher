name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install patchelf
        run: sudo apt-get install -y patchelf

      - name: Bundle Termux Node.js as native library
        run: |
          set -e
          TERMUX_MIRROR="https://packages-cf.termux.dev/apt/termux-main"
          
          mkdir -p termux-work && cd termux-work
          
          # Download Termux package indices
          echo "📦 Fetching package indices..."
          curl -sL "$TERMUX_MIRROR/dists/stable/main/binary-aarch64/Packages.gz" | gunzip > Packages-arm64
          curl -sL "$TERMUX_MIRROR/dists/stable/main/binary-x86_64/Packages.gz" | gunzip > Packages-x64
          
          get_pkg_url() {
            awk "/^Package: $2\$/,/^\$/" "Packages-$1" | grep "^Filename:" | head -1 | awk '{print $2}'
          }
          
          extract_deb() {
            local deb="$1" dest="$2"
            mkdir -p tmp_deb
            ar x "$deb" --output=tmp_deb 2>/dev/null || true
            for archive in tmp_deb/data.tar.*; do
              [ -f "$archive" ] && tar xf "$archive" -C "$dest" 2>/dev/null || true
            done
            rm -rf tmp_deb
          }
          
          process_arch() {
            local ARCH="$1" JNI_ARCH="$2"
            echo ""
            echo "========== Processing $ARCH → $JNI_ARCH =========="
            
            mkdir -p "${ARCH}-extract"
            for pkg in nodejs libc++ openssl zlib; do
              url=$(get_pkg_url "$ARCH" "$pkg")
              if [ -n "$url" ]; then
                echo "  ⬇️  $pkg"
                wget -q "$TERMUX_MIRROR/$url" -O "${pkg}-${ARCH}.deb"
                extract_deb "${pkg}-${ARCH}.deb" "${ARCH}-extract"
              fi
            done
            
            local JNI_DIR="../app/src/main/jniLibs/$JNI_ARCH"
            mkdir -p "$JNI_DIR"
            
            # Find node binary
            local NODE_BIN=$(find "${ARCH}-extract" -name "node" -path "*/bin/node" -type f | head -1)
            if [ -z "$NODE_BIN" ]; then
              echo "  ❌ Node binary not found for $ARCH!"
              return 1
            fi
            
            echo "  📋 Node needs (before patching):"
            readelf -d "$NODE_BIN" | grep NEEDED | head -20
            
            # Find the lib directory
            local USR_LIB=$(find "${ARCH}-extract" -path "*/usr/lib" -type d | head -1)
            
            # Copy shared libs and build rename map
            # Android only extracts files matching lib*.so — no versioned names!
            # So we rename libz.so.1 → libz_1.so and patchelf node to match
            declare -A RENAME_MAP
            
            if [ -n "$USR_LIB" ]; then
              echo "  📚 Processing shared libraries..."
              
              # Find all .so files that node depends on
              for needed in $(readelf -d "$NODE_BIN" | grep NEEDED | sed 's/.*\[//;s/\]//'); do
                # Find the actual library file
                local src=$(find "$USR_LIB" -name "$needed" -o -name "${needed}.*" 2>/dev/null | head -1)
                
                if [ -z "$src" ]; then
                  # Try resolving the versioned name
                  local base_name=$(echo "$needed" | sed 's/\.so\..*/\.so/')
                  src=$(find "$USR_LIB" -name "${base_name}*" -type f 2>/dev/null | head -1)
                fi
                
                if [ -n "$src" ]; then
                  # Generate Android-compatible name: replace . with _ after .so
                  local android_name
                  if echo "$needed" | grep -q '\.so\.'; then
                    # versioned: libz.so.1 → libz_v1.so
                    android_name=$(echo "$needed" | sed 's/\.so\.\(.*\)/_v\1.so/')
                  else
                    android_name="$needed"
                  fi
                  
                  # Ensure lib prefix
                  case "$android_name" in lib*) ;; *) android_name="lib${android_name}" ;; esac
                  
                  cp "$src" "$JNI_DIR/$android_name"
                  RENAME_MAP["$needed"]="$android_name"
                  echo "    $needed → $android_name ($(ls -lh "$JNI_DIR/$android_name" | awk '{print $5}'))"
                else
                  echo "    ⚠️  $needed — not found (may be system lib)"
                fi
              done
            fi
            
            # Patch node binary to use renamed libraries
            cp "$NODE_BIN" "$JNI_DIR/libnode.so"
            chmod 755 "$JNI_DIR/libnode.so"
            
            for old_name in "${!RENAME_MAP[@]}"; do
              local new_name="${RENAME_MAP[$old_name]}"
              if [ "$old_name" != "$new_name" ]; then
                echo "  🔧 patchelf: $old_name → $new_name"
                patchelf --replace-needed "$old_name" "$new_name" "$JNI_DIR/libnode.so" 2>/dev/null || echo "    (skip)"
              fi
            done
            
            # Also patch the interpreter if it's set to termux linker
            patchelf --remove-rpath "$JNI_DIR/libnode.so" 2>/dev/null || true
            
            echo "  📋 Node needs (after patching):"
            readelf -d "$JNI_DIR/libnode.so" | grep NEEDED | head -20
            
            echo "  ✅ $JNI_ARCH done!"
          }
          
          process_arch "arm64" "arm64-v8a"
          process_arch "x64" "x86_64" || echo "⚠️  x86_64 optional, continuing..."
          
          # Bundle npm as assets
          NPM_DIR=$(find arm64-extract -path "*/lib/node_modules/npm" -type d | head -1)
          if [ -n "$NPM_DIR" ]; then
            mkdir -p ../app/src/main/assets/npm
            cp -r "$NPM_DIR"/* ../app/src/main/assets/npm/
            echo ""
            echo "✅ npm bundled: $(du -sh ../app/src/main/assets/npm/ | awk '{print $1}')"
          fi
          
          echo ""
          echo "📊 Final jniLibs:"
          find ../app/src/main/jniLibs -type f -exec ls -lh {} \;

      - name: Install Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Setup debug keystore
        run: |
          mkdir -p $HOME/.android
          keytool -genkeypair -v \
            -keystore $HOME/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Re-sign APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find $ANDROID_HOME -name "apksigner" -type f 2>/dev/null | sort -r | head -1)
          ZIPALIGN=$(find $ANDROID_HOME -name "zipalign" -type f 2>/dev/null | sort -r | head -1)
          zip -d "$APK" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 2>/dev/null || true
          ALIGNED=/tmp/app-aligned.apk
          "$ZIPALIGN" -f -p 4 "$APK" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks $HOME/.android/debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$APK" "$ALIGNED"
          "$APKSIGNER" verify --verbose "$APK"
          echo "APK size: $(ls -lh "$APK" | awk '{print $5}')"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClawLauncher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
