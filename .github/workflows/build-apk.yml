name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Bundle Termux Node.js as native library
        run: |
          set -e
          TERMUX_MIRROR="https://packages-cf.termux.dev/apt/termux-main"
          
          mkdir -p termux-work && cd termux-work
          
          # Download Termux package index for aarch64
          echo "📦 Fetching Termux aarch64 packages..."
          curl -sL "$TERMUX_MIRROR/dists/stable/main/binary-aarch64/Packages.gz" | gunzip > Packages-arm64
          
          # Download Termux package index for x86_64 (emulators)
          echo "📦 Fetching Termux x86_64 packages..."
          curl -sL "$TERMUX_MIRROR/dists/stable/main/binary-x86_64/Packages.gz" | gunzip > Packages-x64
          
          get_pkg_url() {
            awk "/^Package: $2\$/,/^\$/" "Packages-$1" | grep "^Filename:" | head -1 | awk '{print $2}'
          }
          
          # === ARM64 ===
          echo "⬇️  Downloading aarch64 packages..."
          mkdir -p arm64-extract
          for pkg in nodejs libc++ openssl zlib; do
            url=$(get_pkg_url arm64 "$pkg")
            if [ -n "$url" ]; then
              wget -q "$TERMUX_MIRROR/$url" -O "${pkg}-arm64.deb"
              mkdir -p tmp_deb
              ar x "${pkg}-arm64.deb" --output=tmp_deb 2>/dev/null || true
              for archive in tmp_deb/data.tar.*; do
                [ -f "$archive" ] && tar xf "$archive" -C arm64-extract/ 2>/dev/null || true
              done
              rm -rf tmp_deb
            fi
          done
          
          # === x86_64 ===
          echo "⬇️  Downloading x86_64 packages..."
          mkdir -p x64-extract
          for pkg in nodejs libc++ openssl zlib; do
            url=$(get_pkg_url x64 "$pkg")
            if [ -n "$url" ]; then
              wget -q "$TERMUX_MIRROR/$url" -O "${pkg}-x64.deb"
              mkdir -p tmp_deb
              ar x "${pkg}-x64.deb" --output=tmp_deb 2>/dev/null || true
              for archive in tmp_deb/data.tar.*; do
                [ -f "$archive" ] && tar xf "$archive" -C x64-extract/ 2>/dev/null || true
              done
              rm -rf tmp_deb
            fi
          done
          
          # === Bundle node binary as native library (ONLY way to execute on Android) ===
          # nativeLibraryDir is the ONLY directory with execute permission on modern Android
          
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          mkdir -p ../app/src/main/jniLibs/x86_64
          
          # ARM64 node binary
          NODE_ARM64=$(find arm64-extract -name "node" -path "*/bin/node" -type f | head -1)
          if [ -n "$NODE_ARM64" ]; then
            cp "$NODE_ARM64" ../app/src/main/jniLibs/arm64-v8a/libnode.so
            chmod 755 ../app/src/main/jniLibs/arm64-v8a/libnode.so
            echo "✅ ARM64 node: $(file "$NODE_ARM64") — $(ls -lh ../app/src/main/jniLibs/arm64-v8a/libnode.so | awk '{print $5}')"
          else
            echo "❌ ARM64 node not found!"
            find arm64-extract -name "node" -type f
            exit 1
          fi
          
          # x86_64 node binary
          NODE_X64=$(find x64-extract -name "node" -path "*/bin/node" -type f | head -1)
          if [ -n "$NODE_X64" ]; then
            cp "$NODE_X64" ../app/src/main/jniLibs/x86_64/libnode.so
            chmod 755 ../app/src/main/jniLibs/x86_64/libnode.so
            echo "✅ x86_64 node: $(file "$NODE_X64") — $(ls -lh ../app/src/main/jniLibs/x86_64/libnode.so | awk '{print $5}')"
          fi
          
          # === Bundle shared libraries as native libs too ===
          # These must also be in jniLibs so they end up in nativeLibraryDir
          for arch_dir in arm64 x64; do
            if [ "$arch_dir" = "arm64" ]; then
              JNI_DIR="../app/src/main/jniLibs/arm64-v8a"
              EXTRACT_DIR="arm64-extract"
            else
              JNI_DIR="../app/src/main/jniLibs/x86_64"
              EXTRACT_DIR="x64-extract"
            fi
            
            USR_LIB=$(find "$EXTRACT_DIR" -path "*/usr/lib" -type d | head -1)
            if [ -n "$USR_LIB" ]; then
              for lib in libc++_shared.so libcrypto.so libssl.so libz.so; do
                src=$(find "$USR_LIB" -name "$lib" -type f 2>/dev/null | head -1)
                if [ -n "$src" ]; then
                  # Android requires lib*.so naming
                  target_name="$lib"
                  # Ensure it starts with lib
                  case "$target_name" in lib*) ;; *) target_name="lib${target_name}" ;; esac
                  cp "$src" "$JNI_DIR/$target_name"
                  echo "  📚 [$arch_dir] $target_name"
                fi
              done
            fi
          done
          
          # === Bundle npm as assets (JS files, not executables) ===
          NPM_DIR=$(find arm64-extract -path "*/lib/node_modules/npm" -type d | head -1)
          if [ -n "$NPM_DIR" ]; then
            mkdir -p ../app/src/main/assets/npm
            cp -r "$NPM_DIR"/* ../app/src/main/assets/npm/
            echo "✅ npm bundled: $(du -sh ../app/src/main/assets/npm/ | awk '{print $1}')"
          fi
          
          echo ""
          echo "📊 jniLibs:"
          find ../app/src/main/jniLibs -type f -exec ls -lh {} \;

      - name: Install Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Setup debug keystore
        run: |
          mkdir -p $HOME/.android
          keytool -genkeypair -v \
            -keystore $HOME/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Re-sign APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find $ANDROID_HOME -name "apksigner" -type f 2>/dev/null | sort -r | head -1)
          ZIPALIGN=$(find $ANDROID_HOME -name "zipalign" -type f 2>/dev/null | sort -r | head -1)
          zip -d "$APK" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 2>/dev/null || true
          ALIGNED=/tmp/app-aligned.apk
          "$ZIPALIGN" -f -p 4 "$APK" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks $HOME/.android/debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$APK" "$ALIGNED"
          "$APKSIGNER" verify --verbose "$APK"
          echo "APK size: $(ls -lh "$APK" | awk '{print $5}')"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClawLauncher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
