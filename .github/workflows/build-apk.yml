name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install patchelf
        run: sudo apt-get install -y patchelf

      - name: Bundle Termux Node.js
        run: |
          set -e
          MIRROR="https://packages-cf.termux.dev/apt/termux-main"
          PKGS="nodejs npm libc++ openssl zlib c-ares libicu libsqlite"
          
          mkdir -p work && cd work
          curl -sL "$MIRROR/dists/stable/main/binary-aarch64/Packages.gz" | gunzip > Packages
          
          mkdir -p extracted
          for pkg in $PKGS; do
            url=$(grep -A 20 "^Package: ${pkg}$" Packages | grep "^Filename:" | head -1 | awk '{print $2}')
            [ -z "$url" ] && echo "WARN: $pkg not found" && continue
            echo "📦 $pkg → $url"
            wget -q "$MIRROR/$url" -O "${pkg}.deb"
            mkdir -p _deb
            ar x "${pkg}.deb" --output=_deb 2>/dev/null || true
            for f in _deb/data.tar.*; do [ -f "$f" ] && tar xf "$f" -C extracted/ 2>/dev/null || true; done
            rm -rf _deb
          done
          
          NODE=$(find extracted -name "node" -path "*/bin/node" -type f | head -1)
          echo "Node: $NODE"
          echo ""
          echo "=== Original NEEDED ==="
          readelf -d "$NODE" | grep NEEDED
          
          JNIDIR="../app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNIDIR"
          
          # === STEP 1: Copy node binary ===
          cp "$NODE" "$JNIDIR/libnode.so"
          chmod 755 "$JNIDIR/libnode.so"
          
          # === STEP 2: Copy ALL needed libraries (unversioned names) ===
          # These are the direct + transitive deps we need
          echo ""
          echo "=== Copying libraries ==="
          
          copy_lib() {
            local name="$1"
            local src=$(find extracted -name "$name" -type f 2>/dev/null | head -1)
            if [ -f "$src" ]; then
              cp "$src" "$JNIDIR/$name"
              echo "  ✅ $name ($(ls -lh "$JNIDIR/$name" | awk '{print $5}'))"
              return 0
            fi
            # Try versioned variant (e.g., libz.so → libz.so.1)
            local base=$(echo "$name" | sed 's/\.so$//')
            src=$(find extracted -name "${base}.so.*" -type f 2>/dev/null | head -1)
            if [ -f "$src" ]; then
              cp "$src" "$JNIDIR/$name"
              echo "  ✅ $name (from $(basename "$src"), $(ls -lh "$JNIDIR/$name" | awk '{print $5}'))"
              return 0
            fi
            echo "  ❌ $name NOT FOUND"
            return 1
          }
          
          copy_lib "libz.so"
          copy_lib "libcares.so"
          copy_lib "libsqlite3.so"
          copy_lib "libcrypto.so"
          copy_lib "libssl.so"
          copy_lib "libicui18n.so"
          copy_lib "libicuuc.so"
          copy_lib "libicudata.so"
          copy_lib "libc++_shared.so"
          
          # === STEP 3: The KEY fix — patchelf SONAME + NEEDED on ALL binaries ===
          # Problem: patchelf --replace-needed changes DT_NEEDED but the library's
          # own SONAME still says e.g. "libcrypto.so.3". The linker then can't
          # match verneed entries. We must set-soname on each lib too.
          
          # All versioned → unversioned renames
          RENAMES="libz.so.1:libz.so libcrypto.so.3:libcrypto.so libssl.so.3:libssl.so libicui18n.so.78:libicui18n.so libicuuc.so.78:libicuuc.so libicudata.so.78:libicudata.so"
          
          echo ""
          echo "=== Patching ALL binaries ==="
          
          for so_file in "$JNIDIR"/*.so; do
            fname=$(basename "$so_file")
            echo "  🔧 $fname"
            
            # Set SONAME to match the filename (critical!)
            patchelf --set-soname "$fname" "$so_file" 2>/dev/null && echo "    soname → $fname" || true
            
            # Replace all versioned NEEDED entries with unversioned
            for rename in $RENAMES; do
              old="${rename%%:*}"
              new="${rename##*:}"
              patchelf --replace-needed "$old" "$new" "$so_file" 2>/dev/null || true
            done
            
            # Remove rpath (Termux paths)
            patchelf --remove-rpath "$so_file" 2>/dev/null || true
          done
          
          # === STEP 4: Verify everything ===
          echo ""
          echo "=== Verification ==="
          
          # Check node
          echo "--- libnode.so ---"
          echo "  SONAME: $(patchelf --print-soname "$JNIDIR/libnode.so" 2>/dev/null || echo 'none')"
          readelf -d "$JNIDIR/libnode.so" | grep NEEDED
          
          # Check each lib
          for so_file in "$JNIDIR"/*.so; do
            [ "$(basename "$so_file")" = "libnode.so" ] && continue
            fname=$(basename "$so_file")
            soname=$(patchelf --print-soname "$so_file" 2>/dev/null || echo "?")
            echo "--- $fname (soname: $soname) ---"
            for needed in $(readelf -d "$so_file" 2>/dev/null | grep NEEDED | sed 's/.*\[//;s/\]//'); do
              case "$needed" in
                libc.so|libm.so|libdl.so|liblog.so|libandroid.so) ;;
                *)
                  if [ -f "$JNIDIR/$needed" ]; then
                    echo "  ✅ $needed"
                  else
                    echo "  ❌ $needed MISSING!"
                  fi
                  ;;
              esac
            done
          done
          
          # Check verneed sections
          echo ""
          echo "=== verneed check (libnode.so) ==="
          readelf -V "$JNIDIR/libnode.so" 2>/dev/null | head -30 || echo "(no version info)"
          
          echo ""
          echo "=== Final jniLibs ==="
          ls -lh "$JNIDIR"/
          
          # Bundle npm as ZIP asset
          echo ""
          echo "=== Bundling npm ==="
          NPM_DIR=$(find extracted -path "*/lib/node_modules/npm" -type d | head -1)
          echo "NPM_DIR: $NPM_DIR"
          if [ -n "$NPM_DIR" ]; then
            mkdir -p ../app/src/main/assets
            cd "$NPM_DIR"
            zip -rq /tmp/npm-bundle.zip .
            cp /tmp/npm-bundle.zip "$GITHUB_WORKSPACE/app/src/main/assets/npm.zip"
            echo "✅ npm.zip: $(ls -lh "$GITHUB_WORKSPACE/app/src/main/assets/npm.zip" | awk '{print $5}')"
          else
            echo "❌ npm directory not found!"
            find extracted -name "npm" -type d | head -5
          fi

      - name: Install Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Setup debug keystore
        run: |
          mkdir -p $HOME/.android
          keytool -genkeypair -v \
            -keystore $HOME/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Re-sign APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find $ANDROID_HOME -name "apksigner" -type f 2>/dev/null | sort -r | head -1)
          ZIPALIGN=$(find $ANDROID_HOME -name "zipalign" -type f 2>/dev/null | sort -r | head -1)
          zip -d "$APK" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 2>/dev/null || true
          ALIGNED=/tmp/app-aligned.apk
          "$ZIPALIGN" -f -p 4 "$APK" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks $HOME/.android/debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$APK" "$ALIGNED"
          "$APKSIGNER" verify --verbose "$APK"
          echo "APK size: $(ls -lh "$APK" | awk '{print $5}')"

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest
          name: Latest Build
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
