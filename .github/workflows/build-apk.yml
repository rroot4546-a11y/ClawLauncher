name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Bundle Node.js binary as native library
        run: |
          NODE_VER=v20.18.1
          
          # Download arm64 (most Android phones)
          wget -q "https://nodejs.org/dist/$NODE_VER/node-$NODE_VER-linux-arm64.tar.gz"
          tar xzf "node-$NODE_VER-linux-arm64.tar.gz" "node-$NODE_VER-linux-arm64/bin/node"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "node-$NODE_VER-linux-arm64/bin/node" app/src/main/jniLibs/arm64-v8a/libnode.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/libnode.so
          ls -la app/src/main/jniLibs/arm64-v8a/
          
          # Download x86_64 (emulators)
          wget -q "https://nodejs.org/dist/$NODE_VER/node-$NODE_VER-linux-x64.tar.gz"
          tar xzf "node-$NODE_VER-linux-x64.tar.gz" "node-$NODE_VER-linux-x64/bin/node"
          mkdir -p app/src/main/jniLibs/x86_64
          cp "node-$NODE_VER-linux-x64/bin/node" app/src/main/jniLibs/x86_64/libnode.so
          chmod 755 app/src/main/jniLibs/x86_64/libnode.so
          
          # Bundle npm as asset (node needs it to install packages)
          mkdir -p app/src/main/assets/npm
          tar xzf "node-$NODE_VER-linux-arm64.tar.gz" --strip-components=1 -C /tmp "node-$NODE_VER-linux-arm64/lib"
          cp -r /tmp/lib/node_modules/npm app/src/main/assets/npm/
          
          echo "Node binary sizes:"
          ls -lh app/src/main/jniLibs/arm64-v8a/libnode.so
          ls -lh app/src/main/jniLibs/x86_64/libnode.so
          du -sh app/src/main/assets/npm/

      - name: Install Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Setup debug keystore
        run: |
          mkdir -p $HOME/.android
          keytool -genkeypair -v \
            -keystore $HOME/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Re-sign APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find $ANDROID_HOME -name "apksigner" -type f 2>/dev/null | sort -r | head -1)
          ZIPALIGN=$(find $ANDROID_HOME -name "zipalign" -type f 2>/dev/null | sort -r | head -1)
          zip -d "$APK" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 2>/dev/null || true
          ALIGNED=/tmp/app-aligned.apk
          "$ZIPALIGN" -f -p 4 "$APK" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks $HOME/.android/debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$APK" "$ALIGNED"
          "$APKSIGNER" verify --verbose "$APK"
          echo "APK size:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClawLauncher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
